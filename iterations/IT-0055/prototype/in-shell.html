  /* ================================================================ status look (same as the cards) */
  var ST = {
    'Running': { dot: '#009863', ring: '#03AD86', grad: 'linear-gradient(90deg,#005965 0%,#009863 100%)' },
    'Stopped': { dot: '#F90507', ring: '#FF8A8A', grad: 'linear-gradient(90deg,#F90507 0%,#FF8887 100%)' },
    'Idle': { dot: '#0363FF', ring: '#8BB8FF', grad: 'linear-gradient(90deg,#0363FF 0%,#74AAFF 100%)' },
    'No Transmit': { dot: '#1F2328', ring: '#6B7280', grad: 'linear-gradient(90deg,#1F2328 0%,#3A4048 55%,#6B7280 100%)' },
    'Overspeed': { dot: '#FF6B2C', ring: '#FFA36B', grad: 'linear-gradient(90deg,#FF5A14 0%,#FF9447 100%)' },
    'Towed': { dot: '#4BA9B5', ring: '#6FE0E0', grad: 'linear-gradient(90deg,#2B98A5 0%,#86D0D6 100%)' },
    'Yet to Transmit': { dot: '#9AA3B2', ring: '#C3C9D2', grad: 'linear-gradient(90deg,#7C8798 0%,#C3C9D2 100%)' },
  };
  function st(s) { return ST[s] || ST['Yet to Transmit']; }
  function darkChip(s) { return '<span class="pp-dchip" style="background:' + (s === 'Running' ? '#009863' : s === 'Stopped' ? '#F90507' : s === 'Idle' ? '#0363FF' : s === 'Overspeed' ? '#FF5A1F' : s === 'Towed' ? '#2B98A5' : s === 'Yet to Transmit' ? '#8A94A6' : '#1F2328') + '"><i></i>' + s + '</span>'; }
  function lightChip(s) { return '<span class="pp-lchip"><i style="background:' + st(s).dot + '"></i>' + s + '</span>'; }

  /* ================================================================ demo helpers */
  function rng(seed) { var h = 2166136261; for (var i = 0; i < seed.length; i++) { h ^= seed.charCodeAt(i); h = Math.imul(h, 16777619); } return function () { h += 0x6D2B79F5; var t = h; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function clock12(min) { min = ((Math.round(min) % 1440) + 1440) % 1440; var h = Math.floor(min / 60), m = min % 60; return pad(h % 12 || 12) + ':' + pad(m) + ' ' + (h >= 12 ? 'PM' : 'AM'); }
  function hm(min) { min = Math.max(0, Math.round(min)); return Math.floor(min / 60) + ' h ' + pad(min % 60) + ' m'; }
  function home(v) { var r = rng(v.plate + 'h'); return [24.64 + r() * 0.14, 46.60 + r() * 0.16]; }
  function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function fmtLong(d) { return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }); }
  function fmtDay(d) { return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }); }
  function typeOf(name) { var n = name.split(' ')[0]; return { Bus: 'Buses', Truck: 'Trucks', Pickup: 'Pickups', Van: 'Vans' }[n] || 'Vehicles'; }
  function modelOf(v) { var r = rng(v.plate + 'm'); return ['Hyundai H-1', 'Isuzu NPR', 'Toyota Hilux', 'Mitsubishi Canter', 'Tata Ace', 'Ford Transit'][Math.floor(r() * 6)]; }
  function contactOf(v) { var r = rng(v.plate + 'c'); return v.operator === 'Not Assigned' || v.operator === '—' ? '—' : '+966 5' + Math.floor(r() * 10) + ' ' + Math.floor(100 + r() * 900) + ' ' + Math.floor(1000 + r() * 9000); }
  function opId(v) { var r = rng(v.plate + 'o'); return v.operator === 'Not Assigned' || v.operator === '—' ? '—' : 'TAG-' + Math.floor(1000 + r() * 30); }
  function hasDriver(v) { return v.operator && v.operator !== 'Not Assigned' && v.operator !== '—'; }

  /* ================================================================ styles */
  var CSS = `
.pp-scrim{position:fixed;inset:0;z-index:2000;background:rgba(1,21,44,.45);display:grid;place-items:center;padding:16px;box-sizing:border-box;animation:ppF .15s ease;font-family:inherit}
@keyframes ppF{from{opacity:0}}@keyframes ppP{from{opacity:0;transform:translateY(8px) scale(.99)}}@keyframes ppS{to{transform:rotate(360deg)}}
.pp-modal{background:#fff;border-radius:16px;box-shadow:0 24px 60px rgba(1,21,44,.3);display:flex;flex-direction:column;overflow:hidden;max-height:calc(100vh - 32px);width:min(1200px,calc(100vw - 32px));animation:ppP .18s cubic-bezier(.2,.8,.2,1);color:#0B1B2B;font-size:12.5px}
.pp-modal *{box-sizing:border-box}
.pp-head{flex:none;display:flex;align-items:center;gap:12px;padding:14px 16px 14px 20px;background:#fff;border-bottom:1px solid #EEF0F2}
.pp-title{font-size:17px;font-weight:700;line-height:1.2;margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pp-sub{font-size:12.5px;color:#4E5A6B;margin-top:3px}
.pp-x{margin-left:auto;width:28px;height:28px;border-radius:8px;border:1px solid #E3E6EA;background:#fff;color:#0B1B2B;display:grid;place-items:center;cursor:pointer;flex:none}
.pp-x:hover{background:#F5F7F9}
.pp-body{flex:1;min-height:0;overflow:auto;background:#F4F6F8;padding:8px}
.pp-tile{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;background:#EAF7F1;box-shadow:inset 0 0 0 1px #CDEBDD;color:#0E7F5E}
.pp-tile.red{background:#FDECEC;box-shadow:inset 0 0 0 1px #F7C6C6;color:#F90507}
.pp-dchip{display:inline-flex;align-items:center;gap:5px;height:19px;padding:0 9px;border-radius:999px;color:#fff;font-size:11px;font-weight:700;white-space:nowrap}
.pp-dchip i{width:5px;height:5px;border-radius:50%;background:#fff}
.pp-lchip{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 12px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1px #E3E6EA;font-size:12.5px;font-weight:600;white-space:nowrap;color:#0B1B2B}
.pp-lchip i{width:8px;height:8px;border-radius:50%}
.pp-card{background:#fff;border-radius:12px;box-shadow:inset 0 0 0 1px #E8EBEE;padding:12px;min-width:0;position:relative}
.pp-ch{display:flex;align-items:center;gap:10px;padding-bottom:0;margin-bottom:10px;border-bottom:0}
.pp-ch b{font-size:15px;font-weight:700}
.pp-ch small{display:block;font-size:12.5px;color:#8A94A6;margin-top:1px}
.pp-ctile{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
.pp-ctile.green{background:linear-gradient(135deg,#009863 0%,#005965 100%)}
.pp-ctile.red{background:linear-gradient(135deg,#FF5A5F 0%,#E0161B 100%)}
.pp-ctile.blue{background:linear-gradient(135deg,#4A8BFF 0%,#0363FF 100%)}
.pp-ctile.line{background:#EAF7F1;box-shadow:inset 0 0 0 1px #B9E2CF;color:#0E7F5E;width:22px;height:22px;border-radius:6px}
.pp-rows{display:flex;flex-direction:column}
.pp-row{display:flex;align-items:center;gap:7px;min-height:27px;border-bottom:1px solid #EEF0F2;padding:3px 0}
.pp-row span{color:#6B7685;display:flex;align-items:center;gap:7px;white-space:nowrap}
.pp-row span svg{color:#0E7F5E}
.pp-row b{margin-left:auto;font-weight:600;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pp-map{position:relative;border-radius:10px;overflow:hidden;background:#EEF0F2;z-index:0}
.pp-map .leaflet-control-zoom{display:none}
.pp-mctl{position:absolute;left:10px;top:10px;z-index:500;display:flex;flex-direction:column;gap:5px}
.pp-mctl button{width:32px;height:32px;padding:0;border:0;border-radius:9px;background:#fff;box-shadow:0 3px 10px rgba(2,27,58,.18),0 1px 3px rgba(2,27,58,.12),inset 0 0 0 1px #DCE5E1;display:grid;place-items:center;color:#021B3A;cursor:pointer}
.pp-mctl button svg{width:14px;height:14px}
.pp-mctl button:hover{background:#F5F7F9}
.pp-vm{width:34px;height:34px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px #1F2328,0 0 0 9px rgba(31,35,40,.18);display:grid;place-items:center;overflow:hidden}
.pp-vm img{width:24px;height:18px;object-fit:contain}
.pp-alert{display:flex;align-items:center;gap:10px;background:#F5F7F9;border-radius:10px;padding:8px 10px;margin-bottom:6px}
.pp-aic{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
