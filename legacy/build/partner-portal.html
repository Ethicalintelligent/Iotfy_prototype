.tr{display:flex;align-items:center;gap:6px;min-height:30px;padding-right:8px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;border:0;background:none;width:100%;text-align:left;color:var(--ink)}
.tr:hover{background:var(--hover-green)}.tr.on{background:var(--menu-on);box-shadow:inset 0 0 0 1px var(--select-ring)}
.tr .tg{width:20px;height:20px;border:0;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;padding:0;color:var(--muted)}
.sq{width:10px;height:10px;border-radius:3px;background:var(--grad-brand);flex:none}
.sq.def{background:#94A0AF}
.mt label{display:flex;align-items:center;gap:8px;min-height:28px;font-size:12px;cursor:pointer}
/* modal */
.ov{position:fixed;inset:0;background:rgba(1,21,44,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:2000;overflow:auto}
.modal{background:var(--white);border-radius:16px;width:100%;max-width:560px;padding:18px 20px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow-dialog)}
.modal h2,.modal h3{font-size:14px;color:var(--ink-950)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--white);color:var(--ink);box-shadow:var(--shadow-toast),inset 0 0 0 1px #E9ECEF;padding:10px 16px;border-radius:10px;font-size:12px;z-index:400;max-width:90vw}
.slot{padding:10px;border-radius:10px;box-shadow:var(--ring-card);background:var(--white);display:flex;flex-direction:column;gap:6px;min-height:96px}
.slot.free{background:var(--sub)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media(max-width:900px){#login{grid-template-columns:1fr}.hero{padding:28px 18px}.hero h1{font-size:24px;margin-top:8px}.hero ul{display:none}.fgrid{grid-template-columns:1fr}.top{min-height:56px}}
.loading{display:flex;align-items:center;gap:10px;justify-content:center;padding:80px 0;color:var(--muted);font-size:13px}
.spin{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--divider);border-top:2px solid var(--eit-green);animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.editbar{position:fixed;z-index:60;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;max-width:min(860px,calc(100vw - 96px));padding:10px 12px 10px 16px;background:var(--white);border-radius:12px;box-shadow:0 12px 32px rgba(1,29,50,.22),inset 0 0 0 1px #E9ECEF}
.editbar.err{box-shadow:0 12px 32px rgba(195,22,26,.18),inset 0 0 0 1.5px var(--danger)}
.ebtxt{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1;font-size:12px}.ebtxt b{font-size:13px}.ebtxt span{color:var(--muted);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.editbar.err .ebtxt b{color:var(--danger)}
.page.locked [data-c="cell"]:disabled{background:transparent;box-shadow:none;color:var(--ink);opacity:1;cursor:default;-webkit-appearance:none;appearance:none;padding-left:2px}
.page.locked input[type=checkbox][data-c="cell"]:disabled{opacity:.75}
.page:not(.locked){padding-bottom:84px}
.phtools{display:flex;align-items:center;gap:2px;margin-left:6px;padding-left:10px;box-shadow:inset 1px 0 0 #E2E6EA;flex:none}
.ph.phonly{justify-content:flex-end}.phtools{box-shadow:none!important}
.hbtn{position:relative;width:36px;height:36px;border-radius:10px;border:0;background:none;color:var(--ink-soft);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.hbtn:hover,.hbtn.act{background:#EEF1F4;color:var(--ink)}
.hbtn .nb{top:3px;left:auto;right:3px;box-shadow:0 0 0 2px var(--surface,#F4F6F8)}
.hbtn.me .avatar.xs{width:28px;height:28px;font-size:10px}.hbtn .dicon .sdot{right:-1px;bottom:0;width:9px;height:9px;box-shadow:0 0 0 2px #fff}
.top.mobonly .hbtn .nb{box-shadow:0 0 0 2px #fff}
@media(max-width:900px){.phtools{display:none}.ph.phonly{display:none}}
.recdel{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:8px;padding-top:12px;box-shadow:inset 0 1px 0 #EEF0F2}
.linkdanger{border:0;background:none;padding:0;color:var(--danger);font:inherit;font-size:13px;font-weight:700;cursor:pointer}.linkdanger:hover{text-decoration:underline}
.editbar.slim{display:none}
.page>.ph{min-height:40px;padding:0 2px;gap:8px}.page>.ph h1{font-size:15px}
.ptool{gap:8px;flex-wrap:wrap;align-items:center}.ptool input[type=search]{max-width:320px;min-width:200px}
.phtools{padding-left:8px;gap:2px}.hbtn{width:32px;height:32px}.hbtn.me .avatar.xs{width:26px;height:26px}
.hsearch{display:inline-flex;align-items:center;gap:8px;width:260px;height:32px;padding:0 8px 0 10px;margin-right:6px;border:0;border-radius:8px;background:#EEF1F4;color:var(--muted);font:inherit;font-size:13px;cursor:pointer;text-align:left}
.hsearch:hover{background:#E6EAEE;color:var(--ink-soft)}.hsearch span{flex:1}.hsearch kbd{font:600 10px/1 inherit;padding:3px 5px;border-radius:4px;background:#fff;color:var(--muted);box-shadow:inset 0 0 0 1px #DDE1E6}
@media(max-width:1100px){.hsearch{width:180px}.hsearch kbd{display:none}}
.pop.railpop.atright{top:44px}
.eps{display:flex;flex-direction:column;gap:10px;max-width:600px;min-height:0;flex:1 1 auto}
.epshead b{display:block;font-size:14px;color:#fff}.epshead small{color:var(--nav-rest);font-size:12px}
.epsbody{overflow:auto;display:flex;flex-direction:column;gap:12px;padding-right:6px;max-height:44vh}
.epg{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.epg>span{width:100%;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--nav-rest)}
.ep{display:inline-flex;align-items:baseline;gap:6px;padding:6px 10px;border-radius:8px;background:var(--nav-hover);box-shadow:inset 0 0 0 1px var(--nav-divider);color:#fff;font-size:12.5px;font-weight:600;text-decoration:none}
.ep small{color:var(--nav-rest);font-size:10.5px;font-weight:600}.ep:hover{box-shadow:inset 0 0 0 1px #03AD86;background:rgba(3,173,134,.12)}

.hero .epback+h1{margin-top:0}
@media(max-width:900px){.eps{display:none}}
.appgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.apptile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:18px;border:0;border-radius:14px;background:var(--white);box-shadow:inset 0 0 0 1px #E6E9ED;text-align:left;font:inherit;cursor:pointer;min-height:150px}

.appgo{margin-top:auto;font-size:12.5px;font-weight:700;color:var(--green,#03AD86)}
.supbar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;background:#FFF4E5;box-shadow:inset 0 0 0 1px #F5C983;color:#7A4B00;font-size:12.5px}.supbar span{flex:1}

.hero ul.hchips{flex-direction:row;flex-wrap:wrap;gap:8px}.hero ul.hchips li{padding:6px 11px;border-radius:999px;font-size:12px;font-weight:600;color:#CFE3F5;display:flex;align-items:center;gap:6px}

.hero:has(.artwrap) h1{margin-top:0}.hero:has(.artwrap){gap:18px;justify-content:center}

  }).join('');

function page() {
  const p = S.page, d = S.acct;
  if (PRODUCT && p.startsWith('x-')) return xPage(p.slice(2));
  switch (p) {
    case 'tree': return pTree();
    case 'features': return pFeatures();
    case 'datapoints': return listPage('Data_Points', { hint: 'One reading (In) or command (Out). Features need them; devices and sensors give them.' });
    case 'interfaces': return listPage('Interfaces', { hint: 'How a sensor plugs into a device: DI, DO, AI, RS485, CAN, 1-Wire, BLE, LoRaWAN.' });
    case 'hardware': return pHardware();
    case 'assettypes': return listPage('Asset_Types', { hint: 'What we track. A product applies to one or more asset types (set on the product).' });
    case 'pricing': return pPricing();
    case 'roles': return pRoles();
    case 'lookups': return pLookups();
    case 'dealers': return pDealers();
    case 'subs': return pSubs();
    case 'compat': return pCompat();
    case 'sheet': return pSheet();
    case 'companies': return listPage('Companies', { fixed: { 'Dealer ID': d }, cols: ['ID', 'Name', 'Country', 'Contact', 'Status'], hint: 'The companies this dealer sells to.' }) + customerSupportCard();
    case 'stock': return pStock();
    case 'assets': return pAssets();
    case 'quotes': return pQuotes();
    case 'users': return listPage('Users', { fixed: { Level: S.role === 'dealer' ? 'Dealer' : 'Company', 'Account ID': d }, cols: ['ID', 'Name', 'Email', 'Role ID', 'Asset Group'], hint: 'Each user has one role. Fleet managers see the assets in their asset group.' }) + (S.role === 'company' && PRODUCT ? supportCard('Company', S.acct) : '');
    case 'vehicles': return pVehicles();
    case 'live': return pLive();
    case 'apps': return pApps();
    case 'settings': return pDealerSettings();
    case 'sites': return pSites();
    case 'certs': { const aids = new Set(DB.Assets.filter((x) => myCompanies().some((c) => c.ID === x['Company ID'])).map((x) => x.ID));
      return listPage('Certificates', { filter: (r) => aids.has(r['Asset ID']), readonly: true, cols: ['ID', 'Asset ID', 'Certification', 'Certificate No', 'Issued By', 'Issued On', 'Valid Until', 'Status'], act: 'opencertasset',

  }
  return '<div class="empty">Page not found.</div>';
}

      + optionalOf(n.ID).map((x) => `<div class="tr" style="padding-left:${8 + (d + 1) * 18 + 20}px;cursor:default"><span style="width:14px;height:14px;border:1.5px dashed #6B7685;border-radius:4px;flex:none"></span><span style="font-style:italic;color:#4B5563;font-size:13px">optional: ${esc(byId('Nodes', x)?.Name || x)}</span></div>`).join('') : '';
    return `<div class="tr ${sel && sel.ID === n.ID ? 'on' : ''}" style="padding-left:${8 + d * 18}px" data-a="selnode" data-id="${n.ID}" role="treeitem" aria-selected="${sel && sel.ID === n.ID}" tabindex="0">
      ${kc ? `<button class="tg" data-a="toggle" data-id="${n.ID}" aria-label="${open ? 'Collapse' : 'Expand'}" style="transform:rotate(${open ? 90 : 0}deg)">${I.chev}</button>` : '<span style="width:20px;flex:none"></span>'}

        : `<span class="sq ${n.Status !== 'Active' ? 'def' : ''}"></span><span>${esc(n.Name)}</span>${n.Kind ? `<span class="chip" style="margin-left:auto;font-size:11px;padding:1px 7px">${esc(n.Kind)}</span>` : ''}`}
    </div>${inc}${open ? rowsHtml(n.ID, d + 1) : ''}`;
  }).join('');
  const addParent = sel ? sel.ID : '';
  return `<div class="ph"><div><h1>Product Tree</h1><p>Groups are folders. Only Products are sold, priced and given features. Each product sits once; "includes" is a link, never a copy.</p></div>
</div>

    <div class="row treebar" style="gap:6px;flex-wrap:nowrap"><div style="flex:1;min-width:0">${searchBox('tree', 'Search groups and products')}</div><button class="btn sm" title="New group under the selected group" data-a="new" data-t="Nodes" data-fixed="${esc(JSON.stringify({ Type: 'Group' }))}" data-def="${esc(JSON.stringify({ Status: 'Active', 'Parent ID': sel && sel.Type === 'Group' ? sel.ID : (sel?.['Parent ID'] || '') }))}">+ Group</button>
  <button class="btn sm pri" title="New product under the selected item" data-a="new" data-t="Nodes" data-fixed="${esc(JSON.stringify({ Type: 'Product' }))}" data-def="${esc(JSON.stringify({ Status: 'Active', Kind: sel && isProd(sel) ? 'Add-on' : 'Base', 'Parent ID': addParent }))}">+ Product</button></div>
    <div class="row" style="gap:8px"><select data-i="q" data-k="treeStatus" aria-label="Status" style="flex:1">${opts([['', 'Status: all'], ['Active', 'Active'], ['Deferred', 'Deferred'], ['Inactive', 'Inactive']], st)}</select>

// ===================================================================== Features (master-detail)

  <button class="btn" data-a="new" data-t="${t}" data-fixed="{}">+ Add</button></section>`;
}
function pFeatures() {

// ===================================================================== Hardware catalogue

  const tab = S.tab.hw || 'dev';
  const head = `<div class="ph"><div><h1>Hardware Catalogue</h1><p>Models, not real boxes. Each model lists its interfaces and the data points it gives. Real units (IMEI / serial) live in dealer stock.</p></div></div>

  if (tab === 'hwp') return head + listPage('Hardware_Prices', { title: 'Hardware Prices', hint: 'One-time price per model, per level. Supply: Sold, Rented (recurring) or Free with a minimum term.', cols: ['ID', 'Model Kind', 'Model ID', 'Sold To', 'Supply', 'Price', 'Min Term Months', 'Currency'] });

      <div class="col" style="gap:6px"><div style="font-size:12px;font-weight:600;color:#4B5563">Certifications this model carries</div><div class="row" style="gap:14px">${lookupOpts('Certification').map(([c]) => `<label class="row" style="gap:6px;font-size:13.5px"><input type="checkbox" data-a="dcert" data-id="${d.ID}" data-k="${esc(c)}" ${certs.includes(c) ? 'checked' : ''}>${esc(c)}</label>`).join('') || '<span class="muted">No certifications in Lookups yet.</span>'}</div></div></div>
      <div class="card col" style="padding:20px"><h3 style="font-size:17px">Interfaces on this model</h3>${childGrid('Device_Interfaces', 'Device Model ID', d.ID, ['Interface ID', 'Count'], { add: 'Add interface', extra: { Count: '1' } })}</div>
      <div class="card col" style="padding:20px"><h3 style="font-size:17px">Built-in data points</h3><p class="muted" style="margin:0;font-size:13px">Measured by the device itself, no sensor needed.</p>${childGrid('Device_Data_Points', 'Device Model ID', d.ID, ['Data Point ID'], { add: 'Add data point' })}</div>
      <div class="card col" style="padding:20px"><h3 style="font-size:17px">Sensors that fit (worked out)</h3>

  }
  return head + `<div class="row" style="align-items:flex-start;gap:18px">${masterList('Sensor_Models', 'sens', DB.Sensor_Models, (r) => sensIfaces(r.ID).map((i) => label('Interfaces', i['Interface ID'])).join(' · '))}<section class="col" style="flex:3 1 520px;min-width:0">${det}</section></div>`;
}

    return `<tr><td style="font-weight:500">${esc(f.Name)}<div class="muted" style="font-size:12px;font-weight:400">${esc(f.Type || '')}${f['Is Command'] === 'Yes' ? ' · command' : ''}</div></td><td style="width:1%;white-space:nowrap"><div role="radiogroup" aria-label="Access to ${esc(f.Name)}" class="row" style="gap:0;border:1px solid #D7D8DB;border-radius:8px;overflow:hidden;flex-wrap:nowrap">${['Hidden', 'View', 'Use'].map((x) => `<button class="btn sm" role="radio" aria-checked="${a === x}" style="border:0;border-radius:0;${a === x ? (x === 'Use' ? 'background:linear-gradient(90deg,#009863,#005965);color:#fff;text-shadow:0 1px 1px rgba(1,29,50,.16)' : x === 'View' ? 'background:linear-gradient(90deg,#0363FF,#74AAFF);color:#fff;text-shadow:0 1px 1px rgba(1,29,50,.16)' : 'background:#2B333C;color:#fff') : ''}" data-a="acc" data-r="${r.ID}" data-f="${f.ID}" data-k="${x}">${x}</button>`).join('')}</div></td></tr>`; }).join('')}</tbody></table></div>`).join('')}</div>` : ''}</section></div>`;

function pLookups() {
  const lists = [...new Set([...LOOKUP_LISTS(), ...DB.Lookups.map((r) => r.List)])];
  const cur = lists.includes(S.sel.lk) ? S.sel.lk : lists[0]; S.sel.lk = cur;
  const rows = DB.Lookups.filter((r) => r.List === cur).sort((a, b) => num(a.Sort) - num(b.Sort));
  const used = lookupFields(cur).map(([t, k]) => `${SCHEMA[t].title} › ${k}`);
  return `<div class="ph"><div><h1>Lookups</h1><p>Editable dropdown lists. Renaming a value updates every row that uses it. Lists the platform's logic depends on (statuses, bundle rule types, access levels, supply, price rule types) stay fixed.</p></div></div>
  <div class="row" style="align-items:flex-start;gap:18px"><section class="card col" style="flex:1 1 260px;padding:14px;gap:4px">${lists.map((l) => `<button class="tr ${l === cur ? 'on' : ''}" style="padding:8px 10px;flex-direction:column;align-items:flex-start;gap:2px" data-a="sel" data-k="lk" data-id="${esc(l)}"><span style="font-weight:600">${esc(l)}</span><span class="muted" style="font-size:12px">${DB.Lookups.filter((r) => r.List === l).length} values</span></button>`).join('')}</section>
  <section class="card col" style="flex:3 1 520px;min-width:0;padding:20px"><div class="row sb"><h2 style="font-size:22px">${esc(cur || '')}</h2><button class="btn pri" data-a="addrow" data-t="Lookups" data-pk="List" data-pv="${esc(cur || '')}" data-extra="${esc(JSON.stringify({ Active: 'Yes', Sort: String(rows.length + 1) }))}">+ Value</button></div>

  ${rows.map((r) => { const n = lookupUse(r.List, r.Value); return `<tr><td>${input('Lookups', r, 'Value')}</td><td>${input('Lookups', r, 'Sort')}</td><td>${input('Lookups', r, 'Active')}</td><td class="muted">${n} row(s)</td><td style="width:1%">${n ? '<span class="muted" style="font-size:12px">in use</span>' : `<button class="btn sm ghost" data-a="rm" data-t="Lookups" data-id="${esc(r.ID)}">Remove</button>`}</td></tr>`; }).join('') || '<tr><td colspan="5" class="muted">No values yet.</td></tr>'}
  </tbody></table></div><div class="note grey">Set Active to No to hide a value from dropdowns without changing rows that already use it.</div></section></div>`;
}
function setAccess(rid, fid, a) {
  if (!where('Role_Features', (x) => x['Role ID'] === rid).length) DB.Features.forEach((f) => { if (f.ID !== fid) DB.Role_Features.push(blank('Role_Features', { 'Role ID': rid, 'Feature ID': f.ID, Access: access(rid, f.ID) })); });
  const row = DB.Role_Features.find((x) => x['Role ID'] === rid && x['Feature ID'] === fid);
  if (row) row.Access = a; else DB.Role_Features.push(blank('Role_Features', { 'Role ID': rid, 'Feature ID': fid, Access: a }));
  touch('Role_Features');
}

function resellerCard(d) {

// ===================================================================== Compatibility
function pCompat() {

  const all = withNeeds(sel); const feats = featsOfSet(all);

  const sens = new Map(); [...dps.keys()].forEach((dp) => where('Sensor_Data_Points', (r) => r['Data Point ID'] === dp).forEach((r) => sens.set(r['Sensor Model ID'], dp)));

  const models = DB.Device_Models.filter((d) => d.Status !== 'Inactive');
  return `<div class="ph"><div><h1>Compatibility Checker</h1><p>Pick products. The platform follows Product → Feature → Data Point → Sensor → Interface → Device and shows what hardware works.</p></div></div>

  ${all.size > sel.length ? `<div class="note grey">Also counted (needed or included): ${[...all].filter((x) => !sel.includes(x)).map((x) => esc(label('Nodes', x))).join(', ')}</div>` : ''}
  ${at && sel.some((p) => !where('Product_Asset_Types', (r) => r['Product ID'] === p && r['Asset Type ID'] === at).length) ? `<div class="note">Some picked products are not set up for asset type ${esc(label('Asset_Types', at))}.</div>` : ''}

  ${col(1, 'Features', 'From the products', feats.map((f) => [label('Features', f.fid), f.avail]))}
  ${col(2, 'Data points', 'What the features need', [...dps.keys()].map((d) => [label('Data_Points', d), `${byId('Data_Points', d)?.Unit || ''} · ${byId('Data_Points', d)?.Direction || ''}`]))}
  ${col(3, 'Sensors', 'Who gives them', [...sens.entries()].map(([s, d]) => [label('Sensor_Models', s), sensIfaces(s).map((i) => label('Interfaces', i['Interface ID'])).join(' · ')]))}
  ${col(4, 'Interfaces', 'How they plug in', [...ifs].map((i) => [label('Interfaces', i), byId('Interfaces', i)?.Medium || '']))}
  ${col(5, 'Devices', 'That fit everything', models.filter((d) => evalModel(d.ID, feats).all && !certMiss(d.ID, all).length).map((d) => [label('Device_Models', d.ID), d.Type]))}</div>

function lineCalc(l, q) {
  if (l.Kind === 'Product') {
    const r = priceLine(l['Item ID'], 'Company', { tier: l.Tier, qty: num(l.Qty || 1), assetType: l['Asset Type ID'], items: num(l['Item Count']) });
    if (has(l['Package ID'])) { const pp = planFor(l['Package ID'], 'Company'); const n = where('Quote_Lines', (x) => x['Quote ID'] === l['Quote ID'] && x.Kind === 'Product' && x['Package ID'] === l['Package ID']).length;
      if (pp) where('Price_Rules', (x) => x['Plan ID'] === pp.ID && x['Rule Type'] === 'Package discount' && has(x.Value) && inBand(x.Condition, n)).forEach((x) => { r.unit = r.unit * (1 - num(x.Value) / 100); r.applied.push(`${label('Nodes', l['Package ID'])} ${n} components −${x.Value}%`); }); }
    const snap = has(l['Unit Price']); return { unit: snap ? num(l['Unit Price']) : r.unit, live: !snap, applied: snap ? l['Rules Applied'] : r.applied.join(' → '), rec: (snap ? num(l['Unit Price']) : r.unit) * num(l.Qty), one: 0, cur: r.cur };
  }
  const kind = byId('Sensor_Models', l['Item ID']) ? 'Sensor' : 'Device'; const hp = hwPrice(kind, l['Item ID'], 'Company', l.Supply || 'Sold');
  const snap = has(l['Unit Price']); const unit = snap ? num(l['Unit Price']) : num(hp?.Price);
  return { unit, live: !snap, applied: hp ? '' : 'no hardware price', one: l.Supply === 'Rented' ? 0 : unit * num(l.Qty), rec: l.Supply === 'Rented' ? unit * num(l.Qty) : 0, cur: hp?.Currency || 'SAR' };
}
function quoteDetail(q) {

  const pids = pl.map((l) => l['Item ID']);

  const minTerm = Math.max(0, ...hl.map((l) => num(l['Min Term Months'])));
  const groups = {}; pl.forEach((l) => { (groups[l.Heading || groupPath(l['Item ID'])] ??= []).push(l); });
  const pRow = (l) => { const c = lineCalc(l, q); const n = byId('Nodes', l['Item ID']); return `<tr><td style="font-weight:500;padding-left:${n?.Kind === 'Add-on' ? 26 : 10}px">${n?.Kind === 'Add-on' ? '+ ' : ''}${esc(label('Nodes', l['Item ID']))}<div class="muted" style="font-size:12px;font-weight:400">${esc(n?.Kind || '')}</div>${locked ? (has(l['Edition Choice']) ? `<div class="muted" style="font-size:12px;font-weight:400">Includes ${esc(label('Nodes', l['Edition Choice']))}</div>` : '') : choiceSelect('Quote_Lines', l, l['Item ID'], mkt)}</td>

    <td>${money(c.unit, c.cur)}<div class="muted" style="font-size:11px">${c.live ? 'live · ' : 'saved · '}${esc(c.applied)}</div></td><td style="font-weight:600">${money(c.rec, c.cur)}</td><td>${locked ? '' : `<button class="btn sm ghost" data-a="rm" data-t="Quote_Lines" data-id="${l.ID}">Remove</button>`}</td></tr>`; };

// Page actions (search, + Add, New…, Edit table) live next to the content they act on, not in the title line.
function toolsDown() {
