<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IoTIFY — layout preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
<style>
/* EIT Smart Track design system */
:root{
--eit-green:#009863;--eit-teal:#005965;--eit-mint:#03AD86;--eit-teal-deep:#016A64;
--ink:#011D32;--ink-950:#01152C;--ink-soft:#4B5563;--muted:#6B7685;--muted-1:#748093;
--page:#F7F8FA;--sub:#F9F9FB;--white:#fff;
--border-soft:#F2F4F6;--border:#D7D8DB;--border-input:#D7DAE0;--hairline:#E3E6EA;--card-ring:#E9ECEF;--divider:#EEF0F2;
--danger:#C3161A;--danger-strong:#D92D20;--warning:#E3940E;--info:#025EFE;--success:#069D37;--link:#0E7F5E;--link-hover:#0A5C4A;
--tint-green:#E9F7F0;--tint-blue:#E8F1FF;--tint-red:#FDECEC;--tint-amber:#FCF3E1;--tint-violet:#F4ECFD;
--select-bg:#E8F5EF;--select-ring:#A9D8C3;--select-fg:#0B6E58;--menu-on:#E7F8EF;--hover-green:#F2FBF7;
--nav-surface:#01152C;--nav-rest:#B3B9C0;--nav-hover:rgba(255,255,255,.08);--nav-divider:rgba(255,255,255,.10);
--grad-brand:linear-gradient(90deg,var(--eit-green) 0%,var(--eit-teal) 100%);
--ring-card:inset 0 0 0 2px #F2F4F6;--ring-control:inset 0 0 0 1px #D7D8DB;--ring-brand:inset 0 0 0 1.5px #03AD86;
--shadow-card-app:0 2px 10px rgba(1,29,50,.06),inset 0 0 0 1px #E9ECEF;--shadow-menu:0 14px 40px rgba(1,29,50,.18);--shadow-dialog:0 20px 50px rgba(1,29,50,.25);--shadow-toast:0 6px 24px rgba(1,29,50,.10),0 1px 3px rgba(1,29,50,.06);--glow-brand:0 0 8px 0 #03AD86;
--on-fill:0 1px 1px rgba(1,29,50,.16);
/* legacy names used inline by the app */
--blue:var(--eit-teal-deep);--blue-d:var(--eit-teal);--line:var(--hairline);--line2:var(--divider);--ok:var(--success);--no:var(--danger);
color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
#app{min-height:100%;display:flex;flex-direction:column}#app>*{flex:1}
body{font-family:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--page);font-size:12px;font-weight:600;line-height:1.25;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:inherit;margin:0;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
b,strong{font-weight:700}
p{line-height:1.5}
a{color:var(--link)}a:hover{color:var(--link-hover)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--eit-mint);outline-offset:2px}
.muted{color:var(--muted)}
.card{background:var(--white);border:0;border-radius:14px;box-shadow:var(--shadow-card-app)}
.chip{display:inline-flex;align-items:center;gap:5px;min-height:22px;padding:0 9px;border-radius:999px;font-size:11px;font-weight:700;border:0;box-shadow:inset 0 0 0 1px var(--hairline);color:var(--ink-soft);background:var(--white);white-space:nowrap}
.chip.blue{background:var(--select-bg);box-shadow:inset 0 0 0 1px var(--select-ring);color:var(--select-fg)}
.chip.green{background:var(--tint-green);box-shadow:none;color:#05703A}
.chip.amber{background:var(--tint-amber);box-shadow:none;color:#8A5400}
.chip.red{background:var(--tint-red);box-shadow:none;color:var(--danger)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:34px;padding:0 12px;border-radius:8px;border:1px solid transparent;box-shadow:var(--ring-control);background:var(--white);color:var(--ink);font-weight:600;font-size:12px;cursor:pointer;white-space:nowrap;transition:background .15s ease,box-shadow .15s ease,filter .15s ease}
.btn:hover{background:var(--page)}
.btn:active{filter:brightness(.95)}
.btn.pri{background:var(--grad-brand);box-shadow:var(--ring-brand);color:#fff;text-shadow:var(--on-fill)}
.btn.pri:hover{box-shadow:var(--ring-brand),var(--glow-brand)}
.btn.sm{min-height:28px;padding:0 10px;font-size:12px}
.btn.danger{background:linear-gradient(90deg,#FF5A5F,#C3161A);box-shadow:none;color:#fff;text-shadow:var(--on-fill)}
.btn.ghost{box-shadow:none;background:transparent}
.btn.ghost:hover{background:var(--page)}
.btn[disabled]{opacity:.5;cursor:not-allowed;box-shadow:none}
input,select{min-height:32px;border:0;box-shadow:inset 0 0 0 1px var(--border-input);border-radius:7px;padding:0 10px;background:var(--white);width:100%;font-size:12px;font-weight:600;transition:box-shadow .15s ease}
input:hover,select:hover{box-shadow:inset 0 0 0 1px var(--border)}
input:focus,select:focus{outline:none;box-shadow:inset 0 0 0 1.5px var(--eit-mint)}
input[disabled],select[disabled]{background:var(--sub)}
input[type=checkbox]{width:16px;height:16px;min-height:0;margin:0;accent-color:var(--eit-green);box-shadow:none}
td input,td select{min-height:28px;font-size:12px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--ink-soft)}
table{border-collapse:separate;border-spacing:0 2px;width:100%;font-size:12px}
th{text-align:left;font-weight:700;color:var(--select-fg);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:0 14px;height:40px;background:var(--select-bg);white-space:nowrap;border:0}
th:first-child{border-radius:999px 0 0 999px}th:last-child{border-radius:0 999px 999px 0}
td{padding:6px 14px;height:30.5px;background:var(--white);border:0;box-shadow:inset 0 -1px 0 var(--divider);vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:var(--hover-green)}
.tw{overflow-x:auto;border:0;border-radius:14px;background:var(--white);box-shadow:var(--shadow-card-app);padding:6px 8px}
.ok{color:var(--success);font-weight:700}.no{color:var(--danger);font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sb{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:10px}
.note{padding:10px 12px;border-radius:10px;background:var(--tint-amber);color:#6B4100;font-size:12px;line-height:1.5}
.note.peach{background:var(--tint-green);color:#05603A}
.note.grey{background:var(--sub);color:var(--muted);box-shadow:inset 0 0 0 1px var(--border-soft)}
.tabs{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:var(--sub);box-shadow:inset 0 0 0 1px var(--border-soft);flex-wrap:wrap;align-self:flex-start}
.tab{padding:0 12px;min-height:30px;font-size:12px;font-weight:600;color:var(--ink-soft);border:0;border-radius:8px;background:none;cursor:pointer;transition:background .15s ease}
.tab:hover{background:var(--white)}
.tab.on{background:var(--grad-brand);color:#fff;box-shadow:var(--ring-brand);text-shadow:var(--on-fill);font-weight:700}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.empty{padding:24px;text-align:center;color:var(--muted)}
/* login */
#login{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,560px)}
.hero{background:var(--nav-surface);color:#fff;padding:48px 56px;display:flex;flex-direction:column;gap:24px}
.hero h1{font-size:32px;font-weight:800;line-height:1.12;max-width:560px;margin-top:auto;color:#fff}
.hero h1 span{background:linear-gradient(90deg,#03AD86,#3EF7FF);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--nav-rest);max-width:520px;margin:0;line-height:1.5;font-weight:500;font-size:14px}
.hero ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;max-width:560px}
.hero li{background:var(--nav-hover);box-shadow:inset 0 0 0 1px var(--nav-divider);border-radius:10px;padding:12px 14px;color:var(--nav-rest);font-size:12px;line-height:1.45;font-weight:500}
.hero li b{color:#fff;display:block;font-size:14px}
.logo{display:flex;align-items:center;gap:10px}
.logo i{width:38px;height:38px;border-radius:12px;background:var(--grad-brand);box-shadow:var(--ring-brand);color:#fff;display:flex;align-items:center;justify-content:center;font:800 12px/1 "Instrument Sans",sans-serif;font-style:normal;letter-spacing:.06em;text-shadow:0 1px 2px rgba(1,29,50,.35)}
.lcard{display:grid;place-items:center;padding:40px 32px;background:var(--page)}
.lform{width:100%;max-width:440px;display:flex;flex-direction:column;gap:14px}
.lform h2{font-size:16px;font-weight:800}
.role{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;box-shadow:var(--shadow-card-app);border-radius:10px;background:var(--white);text-align:left;cursor:pointer;width:100%;transition:box-shadow .15s ease}
.role:hover{box-shadow:0 4px 12px rgba(1,29,50,.14),inset 0 0 0 1px #E9ECEF}
.role[aria-checked=true]{box-shadow:inset 0 0 0 1.5px var(--eit-mint),0 0 0 3px var(--menu-on)}
.role b{display:block;font-size:14px}.role small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.role .dot{margin-left:auto;width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--border);flex:none}
.role[aria-checked=true] .dot{box-shadow:inset 0 0 0 5px var(--eit-green)}
/* shell: slim rail, no top bar */
#shell{display:flex;min-height:100vh;padding-left:48px}
aside.side{position:fixed;left:0;top:0;bottom:0;width:48px;background:var(--nav-surface);box-shadow:inset -1px 0 0 var(--nav-hover);display:flex;flex-direction:column;z-index:40;overflow:hidden;transition:width .2s ease,box-shadow .2s ease}
.brand{height:52px;display:flex;align-items:center;padding:0 9px;flex:none}
.brand .logo{gap:12px}
.brand .logo i{width:30px;height:30px;border-radius:9px;font-size:10px;box-shadow:none}
.brand .nl b{display:block;color:#fff;font-weight:800;font-size:15px;line-height:1.1}.brand .nl small{display:block;color:var(--nav-rest);font-size:11px;font-weight:600;margin-top:2px}
.navlist{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 0;display:flex;flex-direction:column;scrollbar-width:none}
.navlist::-webkit-scrollbar{display:none}
.navh{height:21px;flex:none;margin:0;padding:8px 15px 0;line-height:12px;background:linear-gradient(var(--nav-divider),var(--nav-divider)) center 13px/24px 1px no-repeat;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:transparent;white-space:nowrap;overflow:hidden;transition:color .12s ease}
.navh:first-child{background:none}
.nav{position:relative;display:flex;align-items:center;gap:14px;min-height:38px;padding:0 0 0 15px;border-radius:0;color:var(--nav-rest);font-size:13px;font-weight:500;border:0;background:none;width:100%;text-align:left;cursor:pointer;white-space:nowrap;flex:none;transition:color .15s ease,background .15s ease}
.nav:hover{color:#fff;background:rgba(255,255,255,.05)}
.nav.on{color:#fff;font-weight:700;box-shadow:inset 3px 0 0 var(--eit-mint);background:linear-gradient(90deg,rgba(3,173,134,.22),rgba(3,173,134,0) 70%)}
.nav.on svg{color:#2FE0B4}
.nav .nl,.brand .nl{opacity:0;transition:opacity .12s ease}
.nav .nl{flex:1;overflow:hidden;text-overflow:ellipsis;padding-right:10px}
.nb{position:absolute;top:4px;left:26px;min-width:15px;height:15px;padding:0 4px;border-radius:999px;background:var(--danger);color:#fff;font-size:9px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--nav-surface)}
.nb.amber{background:#E3940E}
.railtools{flex:none;padding:6px 0 8px;box-shadow:inset 0 1px 0 var(--nav-divider);display:flex;flex-direction:column}
.railtop{flex:none;padding:2px 0 6px;box-shadow:inset 0 -1px 0 var(--nav-divider);display:flex;flex-direction:column}.railtools .dicon .sdot{right:-1px;bottom:0;width:9px;height:9px}
.pop .dicon .sdot{box-shadow:0 0 0 2px #fff}
.nav.tool.act{color:#fff;background:rgba(255,255,255,.08)}
.dicon{position:relative;display:inline-flex}.dicon .sdot{position:absolute;right:-2px;bottom:-1px;width:7px;height:7px;border-radius:50%;box-shadow:0 0 0 2px var(--nav-surface)}
.nav.me{min-height:46px;padding-left:9px;gap:12px}
.avatar.xs{width:30px;height:30px;font-size:11px}
.nav.me .nl b{display:block;color:#fff;font-size:12px;font-weight:700;line-height:1.2}.nav.me .nl small{display:block;color:var(--nav-rest);font-size:11px;font-weight:600}
@media(min-width:901px){
aside.side.hov,aside.side:has(:focus-visible){width:224px;box-shadow:inset -1px 0 0 var(--nav-hover),12px 0 32px rgba(1,21,44,.35)}
aside.side.hov .nl,aside.side:has(:focus-visible) .nl{opacity:1;transition-delay:.06s}
aside.side.hov .navh,aside.side:has(:focus-visible) .navh{background:none;color:#7D8794}
aside.side.hov .nb,aside.side:has(:focus-visible) .nb{position:static;margin-right:12px;box-shadow:none}}
main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:none}
.top .sp{flex:1}
.iconbtn{position:relative;width:38px;height:38px;border-radius:10px;border:0;background:var(--white);box-shadow:var(--ring-control);color:var(--ink-soft);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.avatar{width:38px;height:38px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;flex:none;color:#fff;font-size:13px;font-weight:700;text-shadow:0 1px 2px rgba(1,29,50,.35)}
.avatar.sm{width:30px;height:30px;font-size:11px}
.t-violet{background:linear-gradient(90deg,#C30DB9,#B96CE0)}.t-blue{background:linear-gradient(90deg,#0363FF,#74AAFF)}.t-green{background:var(--grad-brand)}.t-amber{background:linear-gradient(90deg,#FF6624,#FFA781)}
.scrim{position:fixed;inset:0;z-index:45}.scrim.dim{background:rgba(1,21,44,.35)}
.pop{position:absolute;z-index:46;width:300px;max-height:70vh;overflow-y:auto;background:var(--white);border-radius:10px;box-shadow:var(--shadow-menu),inset 0 0 0 1px #E9ECEF;padding:6px;text-align:left}
.pop.railpop{position:fixed;left:56px;bottom:10px;width:320px}.pop.railpop.atright{top:50px;right:14px;left:auto;bottom:auto;max-height:calc(100vh - 66px)}.pop.railpop.attop{top:56px;bottom:auto;max-height:calc(100vh - 72px)}
.palette{position:fixed;z-index:46;left:50%;top:12vh;transform:translateX(-50%);width:min(560px,92vw);background:var(--white);border-radius:14px;box-shadow:var(--shadow-dialog);overflow:hidden}
.palin{display:flex;align-items:center;gap:10px;padding:0 14px;box-shadow:inset 0 -1px 0 var(--divider);color:var(--muted)}
.palin input{box-shadow:none!important;min-height:52px;font-size:14px;padding:0;background:none}
kbd{font:600 10px/1 inherit;padding:4px 6px;border-radius:5px;box-shadow:inset 0 0 0 1px var(--border);color:var(--muted)}
.palres{max-height:52vh;overflow-y:auto;padding:6px}
.pophead{padding:10px 10px 8px}
.pophead .lbl,.popsec{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.popsec{padding:10px 10px 4px}
.popitem{display:flex;align-items:center;gap:10px;width:100%;min-height:36px;padding:6px 10px;border:0;border-radius:6px;background:none;cursor:pointer;text-align:left;color:var(--ink)}
.popitem:hover{background:var(--hover-green)}.popitem.on{background:var(--menu-on)}
.popitem.on svg{color:var(--eit-green)}
.popitem.danger{color:var(--danger)}
.popitem .grow{flex:1;min-width:0}.popitem b{display:block;font-size:12px}.popitem small{display:block;color:var(--muted);font-size:11px;font-weight:600;margin-top:1px;overflow:hidden;text-overflow:ellipsis}
.popinfo{display:flex;justify-content:space-between;gap:10px;padding:4px 10px;font-size:12px}.popinfo span{color:var(--muted)}
.popsep{height:1px;background:var(--divider);margin:6px 4px}
.popbtns{display:flex;gap:8px;padding:4px 10px 10px}
.ndot{width:8px;height:8px;border-radius:50%;flex:none}.n-red{background:var(--danger)}.n-amber{background:var(--warning)}.n-blue{background:var(--info)}.n-grey{background:#94A0AF}
.navscrim{display:none}
.rtag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:11px;font-weight:700;color:#fff}
/* compact page header: one line */
.page{padding:4px 16px 20px;display:flex;flex-direction:column;gap:10px}
.page>.ph{position:relative;min-height:38px;padding:0;align-items:center}
.phlead{display:flex;align-items:center;flex-wrap:wrap;gap:8px;min-width:0}
.phlead h1{font-size:16px;font-weight:800;margin:0}
.crumbback{min-height:26px!important;padding:0 6px!important;font-size:13px!important;font-weight:600!important;color:var(--muted)!important;box-shadow:none!important}
.crumbback:hover{color:var(--ink)!important;background:var(--page)!important}
.crumbsep{color:var(--muted);font-size:14px;margin:0 -2px}
.phmeta{margin:0!important;font-size:12px;color:var(--muted)}
.phdesc{display:none}
.ph.info-open .phdesc{display:block;position:absolute;z-index:20;top:34px;left:0;max-width:560px;margin:0;padding:10px 12px;background:var(--white);border-radius:10px;box-shadow:var(--shadow-popover-app,0 12px 32px rgba(1,29,50,.18)),inset 0 0 0 1px #E9ECEF;font-size:12px;line-height:1.5;color:var(--ink-soft)}
.infobtn{width:18px;height:18px;border-radius:50%;border:0;padding:0;background:none;box-shadow:inset 0 0 0 1.5px var(--border);color:var(--muted);font:700 11px/18px Georgia,serif;font-style:italic;cursor:pointer}
.infobtn:hover{box-shadow:inset 0 0 0 1.5px var(--eit-mint);color:var(--eit-teal-deep)}
@media(max-width:900px){#shell{padding-left:0}aside.side{width:240px;transform:translateX(-100%);transition:transform .22s ease}#shell.navopen aside.side{transform:none}aside.side .nl{opacity:1}aside.side .navh{background:none;color:#7D8794;height:auto;padding:12px 15px 4px}aside.side .nb{position:static;margin-right:12px}
#shell.navopen .navscrim{display:block;position:fixed;inset:0;background:rgba(1,21,44,.45);z-index:39}
.top.mobonly{display:flex;align-items:center;gap:10px;height:52px;padding:0 10px;background:var(--white);box-shadow:inset 0 -1px 0 var(--divider);position:sticky;top:0;z-index:20}.mobtitle{font-size:15px;font-weight:800}
.pop.railpop{left:10px;right:10px;width:auto}.page{padding:10px}}
/* login extras */
.inico{position:relative;display:flex;align-items:center;color:var(--muted)}.inico svg{position:absolute;left:11px;pointer-events:none}.inico input{padding-left:34px;min-height:40px}
.divtxt{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}.divtxt:before,.divtxt:after{content:"";flex:1;height:1px;background:var(--divider)}
.demo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.demoacct{display:flex;align-items:center;gap:8px;padding:8px 10px;border:0;border-radius:10px;background:var(--white);box-shadow:var(--shadow-card-app);cursor:pointer;text-align:left;min-width:0}
.demoacct:hover{box-shadow:inset 0 0 0 1.5px var(--eit-mint)}
.demoacct b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.demoacct small{display:block;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.demoacct>span:last-child{min-width:0}
@media(max-width:900px){#shell{padding-left:0}aside.side{width:240px;transform:translateX(-100%);transition:transform .22s ease}#shell.navopen aside.side{transform:none}aside.side .nl{opacity:1}aside.side .navh{background:none;color:#7D8794}aside.side .nb{position:static;margin-right:10px}#shell.navopen .navscrim{display:block;position:fixed;inset:0;background:rgba(1,21,44,.45);z-index:29}.iconbtn.mob{display:inline-flex}.gsearch{display:none}.top{padding:0 12px;height:56px}.crumb span,.crumb svg{display:none}.demo{grid-template-columns:1fr}}
.dotst{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.ph{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;justify-content:space-between;padding:6px 2px 2px}
.ph h1{font-size:16px;font-weight:800}.ph h1.dup{display:none}.ph{align-items:center}.ph>div:first-child{flex:1 1 320px;min-width:0}.ph>.row{flex-wrap:nowrap}.ph>.row input{width:240px}.ph h1.dup+p{margin-top:0}
.ph p{margin:4px 0 0;color:var(--muted);font-size:12px;max-width:760px}
.card h3,.tw h3{font-size:14px!important;font-weight:700}
/* tree */
